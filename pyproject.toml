[project]
name = "xfusion"
version = "0.2.0"
description = "xfusion API Backend & Generation Engine"
readme = "README.md"
license = "MIT"
authors = [{ name = "Eramth Ru", email = "contanct@xsolutiontech.com" }]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "requests",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "python-multipart>=0.0.9",
    "diffusers>=0.32.2",
    "transformers>=4.48.3",
    "opencv-python>=4.8.0,<4.11.0",
    "tqdm",
    "scipy>=1.11.0",
    # Linux & NVIDIA CUDA GPU only
    "torch; sys_platform == 'linux'",
    "bitsandbytes>=0.45.3; sys_platform == 'linux'",
    "peft; sys_platform == 'linux'",
    "compel; sys_platform == 'linux'",
]

[project.scripts]
xfusion-server = "server.__main__:main"

[project.urls]
Homepage = "https://xsolutiontech.com"
Repository = "https://github.com/CyberVy/xfusion"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]
